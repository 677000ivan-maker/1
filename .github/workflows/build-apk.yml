name: Build installable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack book application
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q ZonaZabaykalya_Android_Compact.zip -d buildsrc
          rm -rf buildsrc/.github

      - name: Improve toolbar visibility and accessibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/app/src/main/assets/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<meta name="theme-color" content="#ede8de">','<meta name="theme-color" content="#b58b55">')
          s=s.replace('--bar:rgba(244,240,232,.96);','--bar:#e5c99a; --bar-text:#3a210f;')
          s=s.replace('--bar:rgba(21,21,21,.96);','--bar:#9b7448; --bar-text:#ffffff;')
          s=s.replace('height:58px;', 'height:72px;', 1)
          s=s.replace('gap:8px;background:var(--bar);','gap:10px;background:var(--bar);')
          s=s.replace('font-size:16px;flex:1;', 'font-size:20px;flex:1;color:var(--bar-text);font-weight:700;')
          s=s.replace('background:transparent;color:var(--text);font-family:system-ui,sans-serif;font-size:20px;min-width:44px;height:44px;', 'background:rgba(255,248,232,.48);color:var(--bar-text);font-family:system-ui,sans-serif;font-size:30px;font-weight:800;min-width:60px;height:58px;border-radius:12px;')
          s=s.replace('top:57px;', 'top:71px;')
          s=s.replace('padding:86px 5.5vw 110px;', 'padding:100px 5.5vw 110px;')
          s=s.replace('#topbar .title{font-size:15px}', '#topbar .title{font-size:18px}')
          p.write_text(s,encoding='utf-8')

          p=Path('buildsrc/app/src/main/java/ru/zona/zabaykalya/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('import android.os.Bundle;', 'import android.os.Bundle;\nimport android.graphics.Color;')
          s=s.replace('getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE);', 'getWindow().setStatusBarColor(Color.rgb(181,139,85));\n        getWindow().setNavigationBarColor(Color.rgb(181,139,85));\n        getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE);')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Build signed debug APK
        run: gradle -p buildsrc :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Zona-Zabaykalya.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zona-Zabaykalya-APK
          path: Zona-Zabaykalya.apk
          retention-days: 30
