name: Build final protected APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare final protected app
        run: |
          rm -rf buildsrc && mkdir buildsrc
          unzip -q ZonaZabaykalya_Android_Compact.zip -d buildsrc
          rm -rf buildsrc/.github
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/app/src/main/assets/index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('--bar:rgba(244,240,232,.96);','--bar:#e5c99a; --bar-text:#3a210f;').replace('--bar:rgba(21,21,21,.96);','--bar:#9b7448; --bar-text:#ffffff;')
          s=s.replace('height:58px;','height:64px;',1).replace('font-size:16px;flex:1;','font-size:0;flex:1;color:var(--bar-text);')
          s=s.replace('background:transparent;color:var(--text);font-family:system-ui,sans-serif;font-size:20px;min-width:44px;height:44px;','background:transparent;color:var(--bar-text);font-family:system-ui,sans-serif;font-size:27px;font-weight:800;min-width:50px;height:50px;padding:0 6px;border-radius:0;')
          s=s.replace('top:57px;','top:63px;').replace('padding:86px 5.5vw 110px;','padding:92px 5.5vw 110px;').replace('#topbar .title{font-size:15px}','#topbar .title{font-size:0}')
          # Change only the two requested TOC entries. Everything else remains exactly as in the source book.
          s=s.replace('Последнее письмо. [6](#последнее-письмо)','Последнее письмо')
          s=s.replace('Глава 5. Закат моего Солнца 92','Глава 5. Закат моего Солнца')
          s=s.replace('<span class="title">Зона Забайкалья</span>','<span class="title"><img src="images/image1.png" alt="" style="height:48px;width:40px;object-fit:cover;border-radius:4px;display:block"></span>')
          p.write_text(s,encoding='utf-8')

          p=Path('buildsrc/app/src/main/java/ru/zona/zabaykalya/MainActivity.java'); j=p.read_text(encoding='utf-8')
          j=j.replace('import android.os.Bundle;','import android.os.Bundle;\nimport android.graphics.Color;\nimport android.view.WindowManager;\nimport java.io.ByteArrayOutputStream;\nimport java.io.InputStream;\nimport javax.crypto.Cipher;\nimport javax.crypto.spec.IvParameterSpec;\nimport javax.crypto.spec.SecretKeySpec;')
          j=j.replace('webView.loadUrl("file:///android_asset/index.html");','loadProtectedBook();')
          marker='    @Override\n    protected void onSaveInstanceState'
          loader='''    private void loadProtectedBook() {\n        try {\n            InputStream in=getAssets().open("book.dat");\n            ByteArrayOutputStream out=new ByteArrayOutputStream();\n            byte[] buf=new byte[8192]; int n;\n            while((n=in.read(buf))>0) out.write(buf,0,n);\n            in.close();\n            byte[] k=new byte[]{90,111,110,97,45,90,97,98,97,121,107,97,108,121,97,45,50,48,50,54,45,80,114,111,116,101,99,116,101,100,33,33};\n            byte[] v=new byte[]{50,48,50,54,48,57,48,57,90,79,78,65,65,80,75,33};\n            Cipher c=Cipher.getInstance("AES/CBC/PKCS5Padding");\n            c.init(Cipher.DECRYPT_MODE,new SecretKeySpec(k,"AES"),new IvParameterSpec(v));\n            String html=new String(c.doFinal(out.toByteArray()),"UTF-8");\n            webView.loadDataWithBaseURL("file:///android_asset/",html,"text/html","UTF-8",null);\n        } catch(Exception e) { webView.loadData("<html><body>Ошибка открытия книги</body></html>","text/html","UTF-8"); }\n    }\n\n'''
          if marker in j: j=j.replace(marker,loader+marker)
          else: j=j.replace('\n    @Override\n    public void onBackPressed', '\n'+loader+'    @Override\n    public void onBackPressed')
          j=j.replace('super.onCreate(savedInstanceState);','super.onCreate(savedInstanceState);\n        getWindow().setStatusBarColor(Color.rgb(181,139,85));\n        getWindow().setNavigationBarColor(Color.rgb(181,139,85));\n        getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE);',1)
          p.write_text(j,encoding='utf-8')
          PY
          KEYHEX=$(printf 'Zona-Zabaykalya-2026-Protected!!' | xxd -p -c 256)
          IVHEX=$(printf '20260909ZONAAPK!' | xxd -p -c 256)
          openssl enc -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" -in buildsrc/app/src/main/assets/index.html -out buildsrc/app/src/main/assets/book.dat
          rm buildsrc/app/src/main/assets/index.html
      - name: Build
        run: gradle -p buildsrc :app:assembleDebug --stacktrace
      - name: Package
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Zona-Zabaykalya-FINAL-TOC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zona-Zabaykalya-FINAL-TOC-APK
          path: Zona-Zabaykalya-FINAL-TOC.apk
          retention-days: 30
