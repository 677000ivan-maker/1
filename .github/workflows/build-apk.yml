name: Build installable APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack book application
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q ZonaZabaykalya_Android_Compact.zip -d buildsrc
          rm -rf buildsrc/.github

      - name: Build signed debug APK
        run: gradle -p buildsrc :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp buildsrc/app/build/outputs/apk/debug/app-debug.apk Zona-Zabaykalya.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zona-Zabaykalya-APK
          path: Zona-Zabaykalya.apk
          retention-days: 30
